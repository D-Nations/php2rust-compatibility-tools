[package]
name = "php2rust-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Runtime support for Rust code generated by php2rust: PHP value semantics (arrays, strings, numbers, built-ins) in safe Rust"

[dependencies]
indexmap = "2.14.2"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }

# This crate keeps the lint set it had in php2rust (the Google Rust style
# guide rules), not the workspace set, until it merges with php2rust-value.
# `#section` names the guide section each lint enforces.

[lints.rust]
# #when-and-how-to-write-documentation
missing_docs = "warn"
# #unsafe-code: nothing in this project needs unsafe code.
unsafe_code = "forbid"
# #no-unstable-features
unstable_features = "deny"

[lints.rustdoc]
# #when-and-how-to-write-documentation
broken_intra_doc_links = "warn"

[lints.clippy]
# The default groups (correctness, suspicious, style, complexity, perf) cover the
# lints the guide names: ptr_arg, borrowed_box, should_implement_trait,
# new_without_default, len_without_is_empty and wrong_self_convention, plus the
# disallowed types and methods configured in clippy.toml.
all = { level = "warn", priority = -1 }

# Code organization
# #dont-use-glob-imports
wildcard_imports = "warn"
# #qualify-calls-to-top-level-functions-with-a-module-name
absolute_paths = "warn"

# Ownership and borrowing
# #prefer-borrows-over-deep-copies
redundant_clone = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"

# Function inputs and outputs
# #accept-flexible-references-for-immutable-data
ref_option = "warn"
# #prefer-enum-over-bool-in-apis (thresholds in clippy.toml)
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"

# Documentation
# #when-and-how-to-write-documentation: document panics.
missing_panics_doc = "warn"

# Implementation concerns
# #prefer-expect-over-unwrap
unwrap_used = "warn"

# Not enabled: exhaustive_enums and exhaustive_structs
# (#apply-non_exhaustive-to-publicly-exposed-enums). They protect published APIs from
# breaking changes; these crates are internal (publish = false).
