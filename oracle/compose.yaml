# The PHP oracle (scripts/record.sh runs it).
#
#   docker compose -f oracle/compose.yaml run --rm php oracle/recorders/php_value.php
services:
  php:
    build: .
    image: php2rust-oracle:8.4.27
    volumes:
      - ..:/work:ro
  # The DOM recorders also read Symfony's XML test fixtures and load the
  # demo's vendor/ (Symfony's XmlUtils and XliffUtils). Set SYMFONY_RS and
  # SYMFONY_DEMO if the checkouts are not next to this repository.
  php-symfony:
    extends: php
    volumes:
      - ${SYMFONY_RS:-../../symfony-rs}/upstream:/upstream:ro
      - ${SYMFONY_DEMO:-../../symfony-demo}:/demo:ro
